<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Snake Game</title>

    <style>.controls {
    margin-top: 10px;
    text-align: center;
}

.controls button {
    width: 60px;
    height: 50px;
    margin: 3px;
    font-size: 24px;
    border: none;
    border-radius: 10px;
    background: #333;
    color: white;
}

.controls button:active {
    background: #555;
}
        body {
            margin: 0;
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        h1 {
            margin-top: 20px;
            margin-bottom: 5px;
        }

        #score {
            font-size: 24px;
            margin: 10px;
        }

        canvas {
            background: #222;
            border: 3px solid white;
            display: block;
            margin: auto;
        }

        /* TOMBOL RESTART */
        #restart {
            display: block;
            margin: 20px auto;
            padding: 12px 30px;
            background: #00aa00;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        #restart:hover {
            background: #00cc00;
        }
    </style>
</head>

<body>

    <h1>🐍 Snake Game</h1>

    <div id="score">
        Score: 0
    </div>

    <canvas id="game" width="500" height="500"></canvas>

    <!-- TOMBOL RESTART -->
     <div class="controls">

    <button onclick="changeDirection('up')">⬆️</button>

    <div>
        <button onclick="changeDirection('left')">⬅️</button>
        <button onclick="changeDirection('down')">⬇️</button>
        <button onclick="changeDirection('right')">➡️</button>
    </div>

</div>
    <button id="restart" onclick="restartGame()">
        RESTART
    </button>


<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const box = 25;
const size = canvas.width / box;

let snake;
let food;
let direction;
let score;
let game;


/* =========================
   RESTART GAME
========================= */

function restartGame() {

    snake = [
        { x: 10, y: 10 },
        { x: 9, y: 10 },
        { x: 8, y: 10 }
    ];

    direction = "right";

    score = 0;

    document.getElementById("score").innerText =
        "Score: " + score;

    createFood();

    clearInterval(game);

    game = setInterval(gameLoop, 120);
}


/* =========================
   MEMBUAT MAKANAN
========================= */

function createFood() {

    food = {
        x: Math.floor(Math.random() * size),
        y: Math.floor(Math.random() * size)
    };

}


/* =========================
   KEYBOARD
========================= */

document.addEventListener("keydown", function(event) {

    if (event.key === "ArrowUp" && direction !== "down") {
        direction = "up";
    }

    if (event.key === "ArrowDown" && direction !== "up") {
        direction = "down";
    }

    if (event.key === "ArrowLeft" && direction !== "right") {
        direction = "left";
    }

    if (event.key === "ArrowRight" && direction !== "left") {
        direction = "right";
    }

});


/* =========================
   GERAK ULAR
========================= */

function moveSnake() {

    let head = {
        x: snake[0].x,
        y: snake[0].y
    };


    if (direction === "up") {
        head.y--;
    }

    if (direction === "down") {
        head.y++;
    }

    if (direction === "left") {
        head.x--;
    }

    if (direction === "right") {
        head.x++;
    }


    /* Tabrak dinding */

    if (
        head.x < 0 ||
        head.x >= size ||
        head.y < 0 ||
        head.y >= size
    ) {

        gameOver();

        return;
    }


    /* Tabrak tubuh */

    for (let i = 0; i < snake.length; i++) {

        if (
            head.x === snake[i].x &&
            head.y === snake[i].y
        ) {

            gameOver();

            return;
        }

    }


    snake.unshift(head);


    /* Makan makanan */

    if (
        head.x === food.x &&
        head.y === food.y
    ) {

        score++;

        document.getElementById("score").innerText =
            "Score: " + score;

        createFood();

    } else {

        snake.pop();

    }

}


/* =========================
   GAMBAR GAME
========================= */

function drawGame() {

    /* Background */

    ctx.fillStyle = "#222";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    /* Makanan */

    ctx.fillStyle = "lime";

    ctx.fillRect(
        food.x * box,
        food.y * box,
        box - 2,
        box - 2
    );


    /* Ular */

    snake.forEach(function(part, index) {

        if (index === 0) {

            ctx.fillStyle = "white";

        } else {

            ctx.fillStyle = "#999";

        }

        ctx.fillRect(
            part.x * box,
            part.y * box,
            box - 2,
            box - 2
        );

    });

}


/* =========================
   GAME LOOP
========================= */

function gameLoop() {

    moveSnake();

    drawGame();

}


/* =========================
   GAME OVER
========================= */

function gameOver() {

    clearInterval(game);

    ctx.fillStyle = "rgba(0,0,0,0.7)";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    ctx.fillStyle = "white";

    ctx.textAlign = "center";

    ctx.font = "40px Arial";

    ctx.fillText(
        "GAME OVER",
        canvas.width / 2,
        canvas.height / 2
    );

}


/* =========================
   MULAI GAME
========================= */

restartGame();

</script>

</body>
</html>
    
</body>
</html>
